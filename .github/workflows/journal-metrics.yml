name: journal-metrics
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Refresh cached publication metadata and EasyScholar results'
        type: boolean
        default: false
      probe_journal:
        description: 'Optional journal to verify provider connectivity (not assigned to papers)'
        type: string
        default: ''
      library_target_per_topic:
        description: '补库：每个研究方向的期刊论文目标数，0 表示常规增量'
        type: choice
        options: ['0', '20', '30']
        default: '0'
      chinese_editorial_b64:
        description: 'Optional source-fingerprinted public Chinese introduction corrections (gzip/base64)'
        type: string
        default: ''
  workflow_run:
    workflows: ['daily-paper-reader']
    types: [completed]
    branches: [main]
permissions:
  contents: write
  pages: write
concurrency:
  group: journal-metrics
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests pyyaml
      - name: Respect manual mode for chained scheduled runs
        id: policy
        env:
          SOURCE_EVENT: ${{ github.event.workflow_run.event || github.event_name }}
        run: python scripts/daily_update_policy.py --event "$SOURCE_EVENT"
      - name: Add verified journal articles alongside arXiv
        if: steps.policy.outputs.run_daily == 'true'
        env:
          LIBRARY_TARGET: ${{ inputs.library_target_per_topic || '0' }}
        run: python scripts/update_journal_library.py --target-per-topic "$LIBRARY_TARGET"
      - name: Cache offline translation weights
        if: steps.policy.outputs.run_daily == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/dpr-translation
          key: dpr-nllb-600m-int8-v1
      - name: Prepare Chinese journal introductions without API calls
        env:
          DPR_CHINESE_EDITORIAL_B64: ${{ inputs.chinese_editorial_b64 }}
        if: steps.policy.outputs.run_daily == 'true'
        run: |
          python -m pip install -r requirements-journal-translation.txt
          python scripts/translate_journal_library.py
      - name: Update public journal metadata cache
        if: steps.policy.outputs.run_daily == 'true'
        env:
          EASYSCHOLAR_SECRET_KEY: ${{ secrets.EASYSCHOLAR_SECRET_KEY }}
          FORCE: ${{ inputs.force }}
          PROBE_JOURNAL: ${{ inputs.probe_journal }}
        run: |
          args=()
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$PROBE_JOURNAL" ]; then args+=(--probe-journal "$PROBE_JOURNAL"); fi
          python scripts/update_journal_metrics.py "${args[@]}"
      - name: Publish metadata only
        if: steps.policy.outputs.run_daily == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/journal-metrics.json docs/journal-library/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh journal metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify matching Pages build
        if: steps.policy.outputs.run_daily == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/request_pages_build.py --timeout 600
